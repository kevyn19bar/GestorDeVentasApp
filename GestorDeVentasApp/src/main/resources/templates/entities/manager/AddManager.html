<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <title>INVENTORY PRO 1.0 - Add Manager</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-white shadow-2xl rounded-xl p-8 md:p-10">

        <div style="margin-bottom: 20px;">
            <!-- Botón Add inventory, corregido a un tag <a> y con el th:href adecuado -->
            <a th:href="@{/addManager}" class="btn btn-outline-success">Add Manager</a>
        </div>

        <form th:action="@{/saveManager}" th:object="${manager}" method="post" class="space-y-6">

            <input type="hidden" th:field="*{manager_id}" />

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="first_name" class="block text-sm font-medium text-gray-700 mb-1">Firs name</label>
                    <input type="text" id="first_name" th:field="*{first_name}"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"
                        required>
                    <!-- Manejo de errores (si defines validaciones en la entidad Managers) -->
                    <p th:if="${#fields.hasErrors('first_name')}" th:errors="*{first_name}" class="text-xs text-red-500 mt-1">
                    </p>
                </div>

                <div>
                    <label for="last_name" class="block text-sm font-medium text-gray-700 mb-1">last name</label>
                    <input type="text" id="last_name" th:field="*{last_name}" min="0" step="0.01"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"
                        required>
                    <p th:if="${#fields.hasErrors('last_name')}" th:errors="*{last_name}" class="text-xs text-red-500 mt-1"></p>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-6">
				<div>
                <label for="address" class="block text-sm font-medium text-gray-700 mb-1">address</label>
                <input type="text" id="address" th:field="*{address}"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                <p th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="text-xs text-red-500 mt-1"></p>
            </div>
                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">phone</label>
                    <input type="text" id="phone" th:field="*{phone}"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                    <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-xs text-red-500 mt-1"></p>
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">email</label>
                    <input type="text" id="email" th:field="*{email}"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
                        class="text-xs text-red-500 mt-1"></p>
                </div>
			 </div>

            <div class="pt-4 flex justify-end space-x-4">
                <a th:href="@{/listManager}"
                    class="px-6 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition duration-150 font-medium">
                    Cancel
                </a>

                <button type="submit"
                    class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-500 focus:ring-opacity-50 transition duration-150 font-medium shadow-md hover:shadow-lg">
                    Save Manager
                </button>
            </div>
        </form>

    </div>
</body>

</html>
