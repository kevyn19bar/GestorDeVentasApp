<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<title th:text="'Edit Product - ' + ${product.product_name} + ' | Inventory Pro'"></title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css">
</head>

<body>

	<div class="sidebar">
		<div class="sidebar-brand ps-3">
			<img th:src="@{/img/logo.png}" src="/img/logo.png" width="45" height="45" class="me-2">
			INV PRO 1.0
		</div>
		<ul class="nav flex-column">
			<li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-home"></i> Dashboard</a></li>
			<div
				style="padding: 15px 25px; font-size: 0.75rem; text-transform: uppercase; color: #aaa; font-weight: bold;">
				Gestión</div>
			<li class="nav-item"><a class="nav-link active" href="/listProducts"><i class="fas fa-boxes"></i>
					Products</a></li>
		</ul>
	</div>

	<div class="content-wrapper">
		<div class="container-fluid">

			<div class="table-card" style="max-width: 850px; margin: 20px auto;">

				<div class="table-title border-bottom pb-3 mb-4">
					<span>
						<i class="fas fa-edit me-2" style="color: var(--primary-color);"></i>
						Edit Product
					</span>
					<span class="badge bg-secondary" th:text="'ID: ' + ${product.product_id}"></span>
				</div>

				<form th:action="@{/saveProduct}" th:object="${product}" method="post">

					<input type="hidden" th:field="*{product_id}" />

					<div class="row">
						<div class="col-md-6 mb-3">
							<label for="product_name" class="form-label">Product Name</label>
							<div class="input-group">
								<span class="input-group-text bg-light"><i class="fas fa-tag"></i></span>
								<input type="text" id="product_name" th:field="*{product_name}" class="form-control"
									placeholder="Ex: Wireless Mouse" required>
							</div>
						</div>

						<div class="col-md-6 mb-3">
							<label for="categoria" class="form-label">Category</label>
							<select class="form-select" id="categoria" th:field="*{categoria}" required>
								<option value="" disabled selected>Select a category</option>
								<option th:each="cat : ${categorias}" th:value="${cat}"
									th:text="${#strings.capitalize(cat.name().toLowerCase())}">
								</option>
							</select>
						</div>
					</div>

					<div class="row">
						<div class="col-md-6 mb-3">
							<label for="product_price" class="form-label">Price ($)</label>
							<div class="input-group">
								<span class="input-group-text bg-light"><i class="fas fa-dollar-sign"></i></span>
								<input type="number" id="product_price" th:field="*{product_price}" step="0.01" min="0"
									class="form-control" placeholder="0.00" required>
							</div>
						</div>

						<div class="col-md-6 mb-3">
							<label for="product_weight" class="form-label">Weight (kg)</label>
							<div class="input-group">
								<span class="input-group-text bg-light"><i class="fas fa-weight-hanging"></i></span>
								<input type="number" id="product_weight" th:field="*{product_weight}" step="0.01"
									min="0" class="form-control" placeholder="0.0" required>
							</div>
						</div>
					</div>

					<div class="row">
						<div class="col-md-6 mb-3">
							<label for="supplierId" class="form-label">Supplier</label>
							<select class="form-select" id="supplierId" th:field="*{supplier_id}" required>
								<option value="" disabled selected>Select a Supplier</option>
								<option th:each="sup : ${supplier}" th:value="${sup.supplier_id}" th:text="${sup.name}">
								</option>
							</select>
						</div>
					</div>

					<div class="d-flex justify-content-end mt-4 pt-3 border-top">
						<a th:href="@{/listProducts}" class="btn-cancel me-3">Cancel</a>
						<button type="submit" class="btn-save">
							<i class="fas fa-save me-2"></i> Update Product
						</button>
					</div>

				</form>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
