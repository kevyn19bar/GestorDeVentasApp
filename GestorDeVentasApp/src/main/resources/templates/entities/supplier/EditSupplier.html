<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Supplier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">
</head>
<body>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                
                <h2>Edit Supplier ID: <span th:text="${supplier.supplier_id}">0</span></h2>
                <hr />

                <form th:action="@{/saveSupplier}" th:object="${supplier}" method="post">
                    
                    <input type="hidden" th:field="*{supplier_id}" />

                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" 
                               id="name" 
                               class="form-control" 
                               th:field="*{name}" 
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="text" 
                               id="phone" 
                               class="form-control" 
                               th:field="*{phone}">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" 
                               id="email" 
                               class="form-control" 
                               th:field="*{email}">
                    </div>
                    
                    <div class="mt-4">
                        <button type="submit" class="btn btn-success me-2">Update Supplier</button> 
                        </button>
                        <a th:href="@{/listAssist}" class="btn btn-secondary">Cancel</a>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</body>
</html>
