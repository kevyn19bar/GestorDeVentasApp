<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>INVENTORY PRO 1.0 | Assistants</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-brand ps-3">
            <img th:src="@{/img/logo.png}" src="/img/logo.png" width="45" height="45" class="me-2">
            INV PRO 1.0
        </div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-home"></i> Dashboard</a></li>
            <div style="padding: 15px 25px; font-size: 0.75rem; text-transform: uppercase; color: #aaa; font-weight: bold;">Gestión</div>
            <li class="nav-item"><a class="nav-link active" href="/listAssist"><i class="fas fa-users"></i> Assistants</a></li>
			<li class="nav-item"><a class="nav-link" href="/listBranch"><i class="fas fa-store"></i> Branch</a></li>
			<li class="nav-item"><a class="nav-link" href="/listWareho"><i class="fas fa-warehouse"></i> Warehouse</a></li>
        </ul>
    </div>

    <div class="content-wrapper">
        <div class="container-fluid">
            
            <div class="table-card">
                
                <div class="table-title">
                    <span><i class="fas fa-user-tie me-2"></i> Assistant</span>
                    <a th:href="@{/addAssist}" class="btn-add-new">
                        <i class="fas fa-plus me-2"></i> Add New
                    </a>
                </div>

                <div class="table-responsive">
                    <table class="table custom-table">
                        <thead>
                            <tr>
                                <th class="text-center" style="width: 120px;">Actions</th>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th>Warehouse</th>
                                <th>Branch</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="Assist : ${Assistants}">
                                <td class="text-center">
                                    <a th:href="@{/editAssist/{id}(id=${Assist.assistant_id})}" class="action-btn btn-edit">
                                        <i class="fas fa-pencil"></i>
                                    </a>
                                    <a th:href="@{/delAssist/{id}(id=${Assist.assistant_id})}" class="action-btn btn-delete"
                                       onclick="return confirm('¿Eliminar este asistente?');">
                                        <i class="fas fa-trash-alt"></i>
                                    </a>
                                </td>
                                <td th:text="${Assist.assistant_id}" class="fw-bold"></td>
                                <td th:text="${Assist.first_name}"></td>
                                <td th:text="${Assist.last_name}"></td>
                                <td th:text="${Assist.phone}"></td>
                                <td th:text="${Assist.email}"></td>
                                <td th:text="${Assist.warehouseIdValue}" class="fw-bold"></td>
                                <td th:text="${Assist.branchIdValue}" class="fw-bold"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
