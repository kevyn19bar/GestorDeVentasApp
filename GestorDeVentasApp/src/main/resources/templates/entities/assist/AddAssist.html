<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add New Assistant | Inventory Pro</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css">
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-brand ps-3">
            <img th:src="@{/img/logo.png}" src="/img/logo.png" width="45" height="45" class="me-2">
            INV PRO 1.0
        </div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-home"></i> Dashboard</a></li>
            <div style="padding: 15px 25px; font-size: 0.75rem; text-transform: uppercase; color: #aaa; font-weight: bold;">Gestión</div>
            <li class="nav-item"><a class="nav-link active" href="/listAssist"><i class="fas fa-users"></i> Assistants</a></li>
            </ul>
    </div>

    <div class="content-wrapper">
        <div class="container-fluid">

            <div class="table-card" style="max-width: 850px; margin: 20px auto;">

                <div class="table-title border-bottom pb-3 mb-4">
                    <span><i class="fas fa-user-plus me-2" style="color: var(--primary-color);"></i> Add New Wizard</span>
                </div>

                <form th:action="@{/saveAssist}" th:object="${assistant}" method="post">
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="firstName" class="form-label">First Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-user"></i></span>
                                <input type="text" th:field="*{first_name}" id="firstName" class="form-control" placeholder="Ex: Carlos" required>
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" th:field="*{last_name}" id="lastName" class="form-control" placeholder="Ex: Perez" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label">Phone</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-phone"></i></span>
                                <input type="tel" th:field="*{phone}" id="phone" class="form-control" placeholder="+1 234 567 890">
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-envelope"></i></span>
                                <input type="email" th:field="*{email}" id="email" class="form-control" placeholder="wizard@hogwarts.com" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="warehouseId" class="form-label">Warehouse</label>
                            <select class="form-select" id="warehouseId" th:field="*{warehouse_id}" required>
                                <option value="" disabled selected>Select a Warehouse</option>
                                <option th:each="Ware : ${Warehouses}" th:value="${Ware.warehouse_id}" th:text="${Ware.warehouse_name}"></option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="branchId" class="form-label">Branch</label>
                            <select class="form-select" id="branchId" th:field="*{branch_id}" required>
                                <option value="" disabled selected>Select a Branch</option>
                                <option th:each="Bran : ${Branches}" th:value="${Bran.branch_id}" th:text="${Bran.branch_name}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end mt-4 pt-3 border-top">
                        <a th:href="@{/listAssist}" class="btn-cancel me-3">Cancel</a>
                        <button type="submit" class="btn-save">
                            <i class="fas fa-check-circle me-2"></i> Create Wizard
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
