<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title th:text="'Edit Branch - ' + ${branch.branch_name} + ' | Inventory Pro'"></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css">
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-brand ps-3">
            <img th:src="@{/img/logo.png}" src="/img/logo.png" width="35" class="me-2">
            INV PRO 1.0
        </div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-home"></i> Dashboard</a></li>
            <div style="padding: 15px 25px; font-size: 0.75rem; text-transform: uppercase; color: #aaa; font-weight: bold;">
                Gestión
            </div>
            <li class="nav-item"><a class="nav-link active" href="/listBranch"><i class="fas fa-store"></i> Branch</a></li>
            </ul>
    </div>

    <div class="content-wrapper">
        <div class="container-fluid">

            <div class="table-card" style="max-width: 850px; margin: 20px auto;">

                <div class="table-title border-bottom pb-3 mb-4">
                    <span>
                        <i class="fas fa-edit me-2" style="color: var(--primary-color);"></i> 
                        Edit Branch: <span th:text="${branch.branch_name}" class="text-muted fw-normal" style="font-size: 0.9em;"></span>
                    </span>
                    <span class="badge bg-secondary" th:text="'ID: ' + ${branch.branch_id}"></span>
                </div>

                <form th:action="@{/savebranch}" th:object="${branch}" method="post">

                    <input type="hidden" th:field="*{branch_id}" />

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="branch_name" class="form-label">Branch Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-store"></i></span>
                                <input type="text" id="branch_name" th:field="*{branch_name}" class="form-control" required>
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="contact_name" class="form-label">Contact Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-user-tie"></i></span>
                                <input type="text" id="contact_name" th:field="*{contact_name}" class="form-control" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="branch_address" class="form-label">Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-map-marker-alt"></i></span>
                                <input type="text" id="branch_address" th:field="*{branch_address}" class="form-control" required>
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="employee_count" class="form-label">Total Employees</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-users"></i></span>
                                <input type="number" id="employee_count" th:field="*{employee_count}" min="0" class="form-control" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="managerId" class="form-label">Manager</label>
                            <select class="form-select" id="managerId" th:field="*{manager_id}" required>
                                <option value="" disabled>Select a Manager</option>
                                <option th:each="Mana : ${Managers}" th:value="${Mana.manager_id}"
                                    th:text="${Mana.first_name}"></option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="warehouseId" class="form-label">Warehouse</label>
                            <select class="form-select" id="warehouseId" th:field="*{warehouse_id}" required>
                                <option value="" disabled>Select a Warehouse</option>
                                <option th:each="Ware : ${Warehouses}" th:value="${Ware.warehouse_id}"
                                    th:text="${Ware.warehouse_name}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="inventoryId" class="form-label">Inventory</label>
                            <select class="form-select" id="inventoryId" th:field="*{inventory_id}" required>
                                <option value="" disabled>Select an Inventory</option>
                                <option th:each="Inven : ${Inventories}" th:value="${Inven.inventory_id}"
                                    th:text="${Inven.inventory_name}"></option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="locationId" class="form-label">Location</label>
                            <select class="form-select" id="locationId" th:field="*{location_id}" required>
                                <option value="" disabled>Select a Location</option>
                                <option th:each="Locat : ${Locations}" th:value="${Locat.location_id}"
                                    th:text="${Locat.state}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end mt-4 pt-3 border-top">
                        <a th:href="@{/listBranch}" class="btn-cancel me-3">Cancel</a>
                        <button type="submit" class="btn-save">
                            <i class="fas fa-save me-2"></i>Update Branch
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
