<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add New Sale | Inventory Pro</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css">
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-brand ps-3">
            <img th:src="@{/img/logo.png}" src="/img/logo.png" width="45" height="45" class="me-2">
            INV PRO 1.0
        </div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-home"></i> Dashboard</a></li>
            <div style="padding: 15px 25px; font-size: 0.75rem; text-transform: uppercase; color: #aaa; font-weight: bold;">Gestión</div>
            <li class="nav-item"><a class="nav-link active" href="/listSales"><i class="fas fa-chart-line"></i> Sales</a></li>
        </ul>
    </div>

    <div class="content-wrapper">
        <div class="container-fluid">

            <div class="table-card" style="max-width: 850px; margin: 20px auto;">

                <div class="table-title border-bottom pb-3 mb-4">
                    <span><i class="fas fa-cash-register me-2" style="color: var(--primary-color);"></i> Add New Sale</span>
                </div>

                <form th:action="@{/saveSale}" th:object="${sale}" method="post">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="branchId" class="form-label">Branch</label>
                            <select class="form-select" id="branchId" th:field="*{branch_id}" required>
                                <option value="" disabled selected>Select a Branch</option>
                                <option th:each="br : ${Branches}" th:value="${br.branch_id}" th:text="${br.branch_name}"></option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="quantity" class="form-label">Quantity</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-cubes"></i></span>
                                <input type="number" id="quantity" th:field="*{quantity}" min="1" class="form-control" placeholder="0" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="subtotal" class="form-label">Subtotal ($)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-dollar-sign"></i></span>
                                <input type="number" id="subtotal" th:field="*{subtotal}" step="0.01" min="0" class="form-control" placeholder="0.00" required>
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="tax" class="form-label">Tax Amount ($)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-file-invoice-dollar"></i></span>
                                <input type="number" id="tax" th:field="*{tax}" step="0.01" min="0" class="form-control" placeholder="0.00" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="discount" class="form-label">Discount ($)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-tags"></i></span>
                                <input type="number" id="discount" th:field="*{discount}" step="0.01" min="0" class="form-control" placeholder="0.00">
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="value" class="form-label">Total Value ($)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-coins"></i></span>
                                <input type="number" id="value" th:field="*{value}" step="0.01" min="0" class="form-control" placeholder="0.00" required>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end mt-4 pt-3 border-top">
                        <a th:href="@{/listSales}" class="btn-cancel me-3">Cancel</a>
                        <button type="submit" class="btn-save">
                            <i class="fas fa-check-circle me-2"></i> Create Sale
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
