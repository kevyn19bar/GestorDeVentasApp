<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
	<title>INVENTORY PRO 1.0 - Add New Sale</title>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
	<div class="container my-4">
		<h1>Add New Sale</h1>
		<hr>

        <!-- Form bound to the 'sale' object, submitting to /saveSale -->
		<form th:action="@{/saveSale}" th:object="${sale}" method="post">
            
            <!-- Branch ID (Long) -->
			<div class="mb-3">
				<label for="branchId" class="form-label">Branch ID:</label>
				<!-- Assuming simple input for Branch ID as the list of branches for a select is not provided -->
				<input type="number" th:field="*{branch_id}" id="branchId" class="form-control" >
				<div th:if="${#fields.hasErrors('branch_id')}" th:errors="*{branch_id}" class="text-danger"></div>
			</div>

            <!-- Quantity (int) -->
			<div class="mb-3">
				<label for="quantity" class="form-label">Quantity:</label>
				<input type="number" th:field="*{quantity}" id="quantity" class="form-control" min="1" required>
				<div th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}" class="text-danger"></div>
			</div>

            <!-- Subtotal (Double) -->
			<div class="mb-3">
				<label for="subtotal" class="form-label">Subtotal:</label>
				<input type="number" step="0.01" th:field="*{subtotal}" id="subtotal" class="form-control" required>
				<div th:if="${#fields.hasErrors('subtotal')}" th:errors="*{subtotal}" class="text-danger"></div>
			</div>

            <!-- Tax (Double) -->
			<div class="mb-3">
				<label for="tax" class="form-label">Tax (%):</label>
				<input type="number" step="0.01" th:field="*{tax}" id="tax" class="form-control" required>
				<div th:if="${#fields.hasErrors('tax')}" th:errors="*{tax}" class="text-danger"></div>
			</div>

            <!-- Discount (Double) -->
			<div class="mb-3">
				<label for="discount" class="form-label">Discount:</label>
				<input type="number" step="0.01" th:field="*{discount}" id="discount" class="form-control" value="0.00">
				<div th:if="${#fields.hasErrors('discount')}" th:errors="*{discount}" class="text-danger"></div>
			</div>
            
            <!-- Total Value (Double) -->
			<div class="mb-3">
				<label for="totalValue" class="form-label">Total Value:</label>
				<input type="number" step="0.01" th:field="*{value}" id="totalValue" class="form-control" required>
				<div th:if="${#fields.hasErrors('value')}" th:errors="*{value}" class="text-danger"></div>
			</div>

			<button type="submit" class="btn btn-success me-2">Create Sale</button>
			<a th:href="@{/listSales}" class="btn btn-secondary">Cancel</a>
		</form>
	</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
