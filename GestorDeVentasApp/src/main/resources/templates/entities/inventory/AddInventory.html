<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
	<title>INVENTORY PRO 1.0 - Add Inventory</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

	<link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css">

</head>

<body>
	<div class="sidebar">
		<div class="sidebar-brand ps-3">
			<img th:src="@{/img/logo.png}" src="/img/logo.png" width="45" height="45" class="me-2">
			INV PRO 1.0
		</div>
		<ul class="nav flex-column">
			<li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-home"></i> Dashboard</a></li>
			<div
				style="padding: 15px 25px; font-size: 0.75rem; text-transform: uppercase; color: #aaa; font-weight: bold;">
				Gestión
			</div>
			<li class="nav-item"><a class="nav-link active" href="/listInventory"><i class="fas fa-clipboard-list"></i>
					Inventory</a></li>
		</ul>
	</div>
	<div class="content-wrapper">
		<div class="container-fluid">

			<div class="table-card" style="max-width: 850px; margin: 20px auto;">

				<div class="table-title border-bottom pb-3 mb-4">
					<span><i class="fas fa-clipboard-list me-2" style="color: var(--primary-color);"></i> Add New
						Inventory</span>
				</div>
				<form th:action="@{/saveinventori}" th:object="${inventori}" method="post">

					<div class="row">
						<div class="col-md-6 mb-3">
							<label for="inventory_name" class="form-label">Inventory Name</label>
							<div class="input-group">
								<span class="input-group-text bg-light"><i class="fas fa-clipboard-list"></i></span>
								<input type="text" id="inventory_name" th:field="*{inventory_name}" class="form-control"
									placeholder="Ex: North Depot" required>
							</div>
						</div>
						<div class="col-md-6 mb-3">
							<label for="capacity_volume" class="form-label">Capacity Volume</label>
							<div class="input-group">
								<span class="input-group-text bg-light"><i class="fas fa-chart-simple"></i></span>
								<input type="number" id="capacity_volume" th:field="*{capacity_volume}" min="0"
									step="0.01" class="form-control" placeholder="Ex: 5000" required>
							</div>
						</div>
					</div>


					<div class="row">
						<div class="col-md-6 mb-3">
							<label for="creation_date" class="form-label">Creation Date</label>
							<div class="input-group">
								<span class="input-group-text bg-light"><i class="fas fa-calendar-alt"></i></span>
								<input type="date" id="creation_date" th:field="*{creation_date}" class="form-control">
							</div>
						</div>
						<div class="col-md-6 mb-3"></div>
					</div>

					<div class="d-flex justify-content-end mt-4 pt-3 border-top">
						<a th:href="@{/listInventory}" class="btn-cancel me-3">Cancel</a>

						<button type="submit" class="btn-save">
							<i class="fas fa-check-circle me-2"></i>Create Inventory
						</button>
					</div>
				</form>
			</div>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
