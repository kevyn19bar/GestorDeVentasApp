<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <title>INVENTORY PRO 1.0 - Edit Order</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Including Tailwind CSS CDN for styling --><script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Using Inter font */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- Main form container --><div class="w-full max-w-2xl bg-white shadow-2xl rounded-xl p-8 md:p-10">

        <div class="text-center mb-8">
            <!-- Título adaptado para la edición --><h1 class="text-3xl font-extrabold text-gray-800">Edit Order Information</h1>
            <p class="text-gray-500 mt-2">Modify the details for Order ID: <span
                    th:text="${order.order_id}" class="font-semibold text-green-600"></span></p>
        </div>

        <!-- Formulario: th:object es "order" y th:action es "/saveorder" --><form th:action="@{/saveOrder}" th:object="${order}" method="post" class="space-y-6">

            <!-- CAMPO OCULTO: ID de la localizacion, esencial para la actualización --><input type="hidden" th:field="*{order_id}" />

            <!-- Row 1: tax--><div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- country --><div>
                    <label for="value" class="block text-sm font-medium text-gray-700 mb-1">Value</label>
                    <input type="number" id="value" th:field="*{value}"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"
                        required>
                    <p th:if="${#fields.hasErrors('value')}" th:errors="*{value}"
                        class="text-xs text-red-500 mt-1"></p>
                </div>

                <!-- tax--><div>
                    <label for="tax" class="block text-sm font-medium text-gray-700 mb-1">Tax</label>
                    <input type="number" id="tax" th:field="*{tax}" min="0" step="0.01"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"
                        required>
                    <p th:if="${#fields.hasErrors('tax')}" th:errors="*{tax}"
                        class="text-xs text-red-500 mt-1"></p>
                </div>
            </div>

            <!-- Row 2: date_order --><div class="grid grid-cols-1 gap-6">
                <!-- city --><div>
                    <label for="date_order" class="block text-sm font-medium text-gray-700 mb-1">date_order</label>
                    <input type="text" id="date_order" th:field="*{date_order}"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                    <p th:if="${#fields.hasErrors('date_order')}" th:errors="*{date_order}"
                        class="text-xs text-red-500 mt-1"></p>
                </div>
            </div>
			
			<!-- Row 2: date_delivered --><div class="grid grid-cols-1 gap-6">
			              <!-- phone --><div>
			                  <label for="date_delivered" class="block text-sm font-medium text-gray-700 mb-1">date_delivered</label>
			                  <input type="date" id="date_delivered" th:field="*{date_delivered}"
			                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
			                  <p th:if="${#fields.hasErrors('date_delivered')}" th:errors="*{date_delivered}"
			                      class="text-xs text-red-500 mt-1"></p>
			              </div>
			          </div>
	
								  
	  <!-- Row 2: supplier_id --><div class="grid grid-cols-1 gap-6">
	    	  			              <!-- email --><div>
	    	  			                  <label for="supplier_id" class="block text-sm font-medium text-gray-700 mb-1">supplier_id</label>
	    	  			                  <input type="number" id="supplier_id" th:field="*{supplier_id}"
	    	  			                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
	    	  			                  <p th:if="${#fields.hasErrors('supplier_id')}" th:errors="*{supplier_id}"
	    	  			                      class="text-xs text-red-500 mt-1"></p>
	    	  			              </div>
	    	  			          </div>
								  
	  <!-- Row 2: branch_id --><div class="grid grid-cols-1 gap-6">
	      	  			              <!-- email --><div>
	      	  			                  <label for="branch_id" class="block text-sm font-medium text-gray-700 mb-1">branch_id</label>
	      	  			                  <input type="number" id="branch_id" th:field="*{branch_id}"
	      	  			                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
	      	  			                  <p th:if="${#fields.hasErrors('branch_id')}" th:errors="*{branch_id}"
	      	  			                      class="text-xs text-red-500 mt-1"></p>
	      	  			              </div>
	      	  			          </div>

            <!-- Action Buttons --><div class="pt-4 flex justify-end space-x-4">
                <!-- Button to go back to the list --><a th:href="@{/listOrders}"
                    class="px-6 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition duration-150 font-medium">
                    Cancel
                </a>

                <!-- Button to update the order (color verde) --><button type="submit"
                    class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 focus:outline-none focus:ring-4 focus:ring-green-500 focus:ring-opacity-50 transition duration-150 font-medium shadow-md hover:shadow-lg">
                    Update Order
                </button>
            </div>
        </form>

    </div>
</body>

</html>
