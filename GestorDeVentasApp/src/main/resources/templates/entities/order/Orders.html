<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <title>Orders Management | Inventory Pro</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css">
	
	<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
	<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.bootstrap5.min.css">
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-brand ps-3">
            <img th:src="@{/img/logo.png}" src="/img/logo.png" width="45" height="45" class="me-2">
            INV PRO 1.0
        </div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-home"></i> Dashboard</a></li>
            <div style="padding: 15px 25px; font-size: 0.75rem; text-transform: uppercase; color: #aaa; font-weight: bold;">
                Gestión
            </div>
            <li class="nav-item"><a class="nav-link active" href="/listOrders"><i class="fas fa-shopping-cart"></i> Orders</a></li>
			<li class="nav-item"><a class="nav-link" href="/listBranch"><i class="fas fa-store"></i> Branch</a></li>
			<li class="nav-item"><a class="nav-link" href="/listSuppl"><i class="fas fa-truck"></i> Suppliers</a></li>
        </ul>
    </div>
	
    <div class="content-wrapper">
        <div class="container-fluid">
            
            <div class="table-card">
                
                <div class="table-title">
                    <span><i class="fas fa-shopping-cart me-2"></i> Orders Management</span>
                    <a th:href="@{/addOrder}" class="btn-add-new">
                        <i class="fas fa-plus-circle me-2"></i> New Order
                    </a>
                </div>

                <div class="table-responsive">
                    <table id="inventoryTable" class="table custom-table table-striped">
                        <thead>
                            <tr>
                                <th class="text-center">Actions</th>
                                <th>ID</th>
                                <th>Date Order</th>
                                <th>Date Delivered</th>
                                <th>Value</th>
                                <th>Tax</th>
                                <th>Branch ID</th>
                                <th>Supplier ID</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="ord : ${Orders}">
                                <td class="text-center">
                                    <div class="d-flex justify-content-center">
                                        <a th:href="@{/editOrder/{id}(id=${ord.order_id})}" class="action-btn btn-edit" title="Edit">
                                            <i class="fas fa-pencil"></i>
                                        </a>
                                        <a th:href="@{/delOrder/{id}(id=${ord.order_id})}" class="action-btn btn-delete" 
                                           title="Delete" onclick="return confirm('¿Delete this order?');">
                                            <i class="fas fa-trash-alt"></i>
                                        </a>
                                    </div>
                                </td>
                                <td th:text="${ord.order_id}" class="fw-bold"></td>
                                <td th:text="${#dates.format(ord.date_order, 'yyyy-MM-dd')}"></td>
                                <td th:text="${#dates.format(ord.date_delivered, 'yyyy-MM-dd')}"></td>
                                <td th:text="${'$ ' + ord.value}"></td>
                                <td th:text="${ord.tax + '%'}"></td>
                                
                                <td th:text="${ord.branch_id}" class="fw-bold"></td>
                                <td th:text="${ord.supplier_id}" class="fw-bold"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(Orders)}">
                                <td colspan="8" class="text-center p-4 text-muted">No orders found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
	<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

	<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
	<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

	<script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
	<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.bootstrap5.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
	<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
	<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>

	<script th:src="@{/js/dashboard.js}" src="/js/dashboard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
