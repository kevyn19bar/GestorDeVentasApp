<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="'Edit Warehouse - ' + ${warehous.warehouse_name} + ' | Inventory Pro'"></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css">
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-brand ps-3">
            <img th:src="@{/img/logo.png}" src="/img/logo.png" width="45" height="45" class="me-2">
            INV PRO 1.0
        </div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-home"></i> Dashboard</a></li>
            <div style="padding: 15px 25px; font-size: 0.75rem; text-transform: uppercase; color: #aaa; font-weight: bold;">Gestión</div>
            <li class="nav-item"><a class="nav-link active" href="/listWareho"><i class="fas fa-warehouse"></i> Warehouses</a></li>
        </ul>
    </div>

    <div class="content-wrapper">
        <div class="container-fluid">

            <div class="table-card" style="max-width: 850px; margin: 20px auto;">

                <div class="table-title border-bottom pb-3 mb-4">
                    <span>
                        <i class="fas fa-edit me-2" style="color: var(--primary-color);"></i> 
                        Edit Warehouse
                    </span>
                    <span class="badge bg-secondary" th:text="'ID: ' + ${warehous.warehouse_id}"></span>
                </div>

                <form th:action="@{/saveWareho}" th:object="${warehous}" method="post">

                    <input type="hidden" th:field="*{warehouse_id}" />

                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label for="warehouse_name" class="form-label">Warehouse Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-building"></i></span>
                                <input type="text" id="warehouse_name" th:field="*{warehouse_name}" class="form-control" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="locationId" class="form-label">Location</label>
                            <select class="form-select" id="locationId" th:field="*{location_id}" required>
                                <option value="" disabled>Select a Location</option>
                                <option th:each="loc : ${Locations}" th:value="${loc.location_id}" th:text="${loc.state}"></option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="managerId" class="form-label">Manager</label>
                            <select class="form-select" id="managerId" th:field="*{manager_id}" required>
                                <option value="" disabled>Select a Manager</option>
                                <option th:each="man : ${Managers}" th:value="${man.manager_id}" th:text="${man.first_name}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="inventoryId" class="form-label">Inventory</label>
                            <select class="form-select" id="inventoryId" th:field="*{inventory_id}" required>
                                <option value="" disabled>Select an Inventory</option>
                                <option th:each="inv : ${Inventaries}" th:value="${inv.inventory_id}" th:text="${inv.inventory_name}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end mt-4 pt-3 border-top">
                        <a th:href="@{/listWareho}" class="btn-cancel me-3">Cancel</a>
                        <button type="submit" class="btn-save">
                            <i class="fas fa-save me-2"></i> Update Warehouse
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
