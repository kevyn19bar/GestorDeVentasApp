<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Warehouse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">
</head>
<body>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                
                <h2>Edit Warehouse ID: <span th:text="${warehous.warehouse_id}">0</span></h2>
                <hr />

                <form th:action="@{/saveWareho}" th:object="${warehous}" method="post">
                    
                    <input type="hidden" th:field="*{warehouse_id}" />

                    <div class="mb-3">
                        <label for="warehouse_name" class="form-label">Warehouse Name</label>
                        <input type="text" 
                               id="warehouse_name" 
                               class="form-control" 
                               th:field="*{warehouse_name}" 
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="location_id" class="form-label">Location ID</label>
                        <input type="number" 
                               id="location_id" 
                               class="form-control" 
                               th:field="*{location_id}">
                    </div>

                    <div class="mb-3">
                        <label for="manager_id" class="form-label">Manager ID</label>
                        <input type="number" 
                               id="manager_id" 
                               class="form-control" 
                               th:field="*{manager_id}">
                    </div>

                    <div class="mb-3">
                        <label for="inventory_id" class="form-label">Inventory ID</label>
                        <input type="number" 
                               id="inventory_id" 
                               class="form-control" 
                               th:field="*{inventory_id}">
                    </div>
                    
                    <div class="mt-4">
                        <button type="submit" class="btn btn-success me-2">Update Warehouse</button> 
                        <a th:href="@{/listWareho}" class="btn btn-secondary">Cancel</a>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</body>
</html>
