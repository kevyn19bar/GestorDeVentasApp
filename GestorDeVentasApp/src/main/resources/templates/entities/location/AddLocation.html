<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <title>INVENTORY PRO 1.0 - Add Location</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-white shadow-2xl rounded-xl p-8 md:p-10">

        <div style="margin-bottom: 20px;">
            <!-- Botón Add inventory, corregido a un tag <a> y con el th:href adecuado -->
            <a th:href="@{/addLocation}" class="btn btn-outline-success">Add Location</a>
        </div>

        <form th:action="@{/savelocation}" th:object="${location}" method="post" class="space-y-6">

            <input type="hidden" th:field="*{location_id}" />

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="country" class="block text-sm font-medium text-gray-700 mb-1">country</label>
                    <input type="text" id="country" th:field="*{country}"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"
                        required>
                    <!-- Manejo de errores (si defines validaciones en la entidad Locations) -->
                    <p th:if="${#fields.hasErrors('country')}" th:errors="*{country}" class="text-xs text-red-500 mt-1">
                    </p>
                </div>

                <div>
                    <label for="state" class="block text-sm font-medium text-gray-700 mb-1">state</label>
                    <input type="text" id="state" th:field="*{state}" min="0" step="0.01"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"
                        required>
                    <p th:if="${#fields.hasErrors('state')}" th:errors="*{state}" class="text-xs text-red-500 mt-1"></p>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-6">
				<div>
                <label for="city" class="block text-sm font-medium text-gray-700 mb-1">city</label>
                <input type="text" id="zone" th:field="*{city}"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                <p th:if="${#fields.hasErrors('city')}" th:errors="*{city}" class="text-xs text-red-500 mt-1"></p>
            </div>
                <div>
                    <label for="zone" class="block text-sm font-medium text-gray-700 mb-1">zone</label>
                    <input type="text" id="zone" th:field="*{zone}"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                    <p th:if="${#fields.hasErrors('zone')}" th:errors="*{zone}" class="text-xs text-red-500 mt-1"></p>
                </div>
                <div>
                    <label for="neighborhood" class="block text-sm font-medium text-gray-700 mb-1">neighborhood</label>
                    <input type="text" id="neighborhood" th:field="*{neighborhood}"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                    <p th:if="${#fields.hasErrors('neighborhood')}" th:errors="*{neighborhood}"
                        class="text-xs text-red-500 mt-1"></p>
                </div>

                 <div>
                    <label for="address" class="block text-sm font-medium text-gray-700 mb-1">address</label>
                    <input type="text" id="address" th:field="*{address}"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                    <p th:if="${#fields.hasErrors('address')}" th:errors="*{address}"
                        class="text-xs text-red-500 mt-1"></p>
                </div>
            </div>

            <div class="pt-4 flex justify-end space-x-4">
                <a th:href="@{/listlocation}"
                    class="px-6 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition duration-150 font-medium">
                    Cancel
                </a>

                <button type="submit"
                    class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-500 focus:ring-opacity-50 transition duration-150 font-medium shadow-md hover:shadow-lg">
                    Save Location
                </button>
            </div>
        </form>

    </div>
</body>

</html>
