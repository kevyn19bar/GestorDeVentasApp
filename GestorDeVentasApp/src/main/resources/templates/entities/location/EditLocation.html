<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="'Edit Location - ' + ${location.city} + ' | Inventory Pro'"></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css">
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-brand ps-3">
            <img th:src="@{/img/logo.png}" src="/img/logo.png" width="45" height="45" class="me-2">
            INV PRO 1.0
        </div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-home"></i> Dashboard</a></li>
            <div style="padding: 15px 25px; font-size: 0.75rem; text-transform: uppercase; color: #aaa; font-weight: bold;">Gestión</div>
            <li class="nav-item"><a class="nav-link active" href="/listLocation"><i class="fas fa-map-marker-alt"></i> Locations</a></li>
        </ul>
    </div>

    <div class="content-wrapper">
        <div class="container-fluid">

            <div class="table-card" style="max-width: 850px; margin: 20px auto;">

                <div class="table-title border-bottom pb-3 mb-4">
                    <span>
                        <i class="fas fa-edit me-2" style="color: var(--primary-color);"></i> 
                        Edit Location
                    </span>
                    <span class="badge bg-secondary" th:text="'ID: ' + ${location.location_id}"></span>
                </div>

                <form th:action="@{/saveLocation}" th:object="${location}" method="post">

                    <input type="hidden" th:field="*{location_id}" />

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="country" class="form-label">Country</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-globe-americas"></i></span>
                                <input type="text" id="country" th:field="*{country}" class="form-control" required>
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="state" class="form-label">State / Department</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-map"></i></span>
                                <input type="text" id="state" th:field="*{state}" class="form-control" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="city" class="form-label">City</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-city"></i></span>
                                <input type="text" id="city" th:field="*{city}" class="form-control" required>
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="zone" class="form-label">Zone</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-compass"></i></span>
                                <input type="text" id="zone" th:field="*{zone}" class="form-control" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="neighborhood" class="form-label">Neighborhood</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-home"></i></span>
                                <input type="text" id="neighborhood" th:field="*{neighborhood}" class="form-control" required>
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="address" class="form-label">Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-road"></i></span>
                                <input type="text" id="address" th:field="*{address}" class="form-control" required>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end mt-4 pt-3 border-top">
                        <a th:href="@{/listLocation}" class="btn-cancel me-3">Cancel</a>
                        <button type="submit" class="btn-save">
                            <i class="fas fa-save me-2"></i> Update Location
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
