<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <title>INVENTORY PRO 1.0 - Edit Manager</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Including Tailwind CSS CDN for styling --><script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Using Inter font */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- Main form container --><div class="w-full max-w-2xl bg-white shadow-2xl rounded-xl p-8 md:p-10">

        <div class="text-center mb-8">
            <!-- Título adaptado para la edición --><h1 class="text-3xl font-extrabold text-gray-800">Edit Manager Information</h1>
            <p class="text-gray-500 mt-2">Modify the details for Manager ID: <span
                    th:text="${manager.manager_id}" class="font-semibold text-green-600"></span></p>
        </div>

        <!-- Formulario: th:object es "manager" y th:action es "/savemanager" --><form th:action="@{/saveManager}" th:object="${manager}" method="post" class="space-y-6">

            <!-- CAMPO OCULTO: ID de la localizacion, esencial para la actualización --><input type="hidden" th:field="*{manager_id}" />

            <!-- Row 1: first_name--><div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- country --><div>
                    <label for="first_name" class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                    <input type="text" id="first_name" th:field="*{first_name}"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"
                        required>
                    <p th:if="${#fields.hasErrors('first_name')}" th:errors="*{first_name}"
                        class="text-xs text-red-500 mt-1"></p>
                </div>

                <!-- last_name--><div>
                    <label for="last_name" class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                    <input type="text" id="last_name" th:field="*{last_name}" min="0" step="0.01"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"
                        required>
                    <p th:if="${#fields.hasErrors('last_name')}" th:errors="*{last_name}"
                        class="text-xs text-red-500 mt-1"></p>
                </div>
            </div>

            <!-- Row 2: address --><div class="grid grid-cols-1 gap-6">
                <!-- city --><div>
                    <label for="address" class="block text-sm font-medium text-gray-700 mb-1">address</label>
                    <input type="text" id="address" th:field="*{address}"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                    <p th:if="${#fields.hasErrors('address')}" th:errors="*{address}"
                        class="text-xs text-red-500 mt-1"></p>
                </div>
            </div>
			
			<!-- Row 2: phone --><div class="grid grid-cols-1 gap-6">
			              <!-- phone --><div>
			                  <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
			                  <input type="text" id="phone" th:field="*{phone}"
			                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
			                  <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"
			                      class="text-xs text-red-500 mt-1"></p>
			              </div>
			          </div>
	
								  
	  <!-- Row 2: email --><div class="grid grid-cols-1 gap-6">
	    	  			              <!-- email --><div>
	    	  			                  <label for="email" class="block text-sm font-medium text-gray-700 mb-1">adress</label>
	    	  			                  <input type="text" id="email" th:field="*{email}"
	    	  			                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
	    	  			                  <p th:if="${#fields.hasErrors('address')}" th:errors="*{address}"
	    	  			                      class="text-xs text-red-500 mt-1"></p>
	    	  			              </div>
	    	  			          </div>

            <!-- Action Buttons --><div class="pt-4 flex justify-end space-x-4">
                <!-- Button to go back to the list --><a th:href="@{/listManager}"
                    class="px-6 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition duration-150 font-medium">
                    Cancel
                </a>

                <!-- Button to update the manager (color verde) --><button type="submit"
                    class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 focus:outline-none focus:ring-4 focus:ring-green-500 focus:ring-opacity-50 transition duration-150 font-medium shadow-md hover:shadow-lg">
                    Update Manager
                </button>
            </div>
        </form>

    </div>
</body>

</html>
