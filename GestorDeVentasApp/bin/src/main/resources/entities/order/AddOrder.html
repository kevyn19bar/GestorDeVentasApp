<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <title>INVENTORY PRO 1.0 - Add Order</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-white shadow-2xl rounded-xl p-8 md:p-10">

        <div style="margin-bottom: 20px;">
            <!-- Botón Add inventory, corregido a un tag <a> y con el th:href adecuado -->
            <a th:href="@{/addOrder}" class="btn btn-outline-success">Add Order</a>
        </div>

        <form th:action="@{/saveOrder}" th:object="${order}" method="post" class="space-y-6">

            <input type="hidden" th:field="*{order_id}" />

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="value" class="block text-sm font-medium text-gray-700 mb-1">value</label>
                    <input type="number" id="value" th:field="*{value}"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"
                        required>
                    <!-- Manejo de errores (si defines validaciones en la entidad Orders) -->
                    <p th:if="${#fields.hasErrors('value')}" th:errors="*{value}" class="text-xs text-red-500 mt-1">
                    </p>
                </div>

                <div>
                    <label for="tax" class="block text-sm font-medium text-gray-700 mb-1">stax</label>
                    <input type="number" id="tax" th:field="*{tax}" min="0" step="0.01"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"
                        required>
                    <p th:if="${#fields.hasErrors('tax')}" th:errors="*{tax}" class="text-xs text-red-500 mt-1"></p>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-6">
				<div>
                <label for="date_order" class="block text-sm font-medium text-gray-700 mb-1">date</label>
                <input type="date" id="date_order" th:field="*{date_order}"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                <p th:if="${#fields.hasErrors('date_order')}" th:errors="*{date_order}" class="text-xs text-red-500 mt-1"></p>
            </div>
                <div>
                    <label for="date_delivered" class="block text-sm font-medium text-gray-700 mb-1">date delivered</label>
                    <input type="date" id="date_delivered" th:field="*{date_delivered}"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                    <p th:if="${#fields.hasErrors('date_delivered')}" th:errors="*{date_delivered}" class="text-xs text-red-500 mt-1"></p>
                </div>
                <div>
                    <label for="supplier_id" class="block text-sm font-medium text-gray-700 mb-1">supplier_id</label>
                    <input type="number" id="supplier_id" th:field="*{supplier_id}"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                    <p th:if="${#fields.hasErrors('supplier_id')}" th:errors="*{supplier_id}"
                        class="text-xs text-red-500 mt-1"></p>
                </div>
				<div>
	                <label for="branch_id" class="block text-sm font-medium text-gray-700 mb-1">branch_id</label>
	                <input type="number" id="branch_id" th:field="*{branch_id}"
	                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
	                <p th:if="${#fields.hasErrors('branch_id')}" th:errors="*{branch_id}"
	                    class="text-xs text-red-500 mt-1"></p>
	            </div>
			 </div>

            <div class="pt-4 flex justify-end space-x-4">
                <a th:href="@{/listOrders}"
                    class="px-6 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition duration-150 font-medium">
                    Cancel
                </a>

                <button type="submit"
                    class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-500 focus:ring-opacity-50 transition duration-150 font-medium shadow-md hover:shadow-lg">
                    Save Order
                </button>
            </div>
        </form>

    </div>
</body>

</html>
